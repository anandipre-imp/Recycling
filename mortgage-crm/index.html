<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mortgage CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left sidebar + scrolling main area, modelled on a broker portal. Collapses to a top bar on phones. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#f0f3f2; --line:#e0e6e3; --line-2:#cfd8d4;
  --fg:#17211d; --muted:#5f6d68; --accent:#1f5f45; --accent-2:#2c7a5a; --accent-soft:#e3f0ea; --on-accent:#ffffff;
  --blue:#2f5fb3; --indigo:#5848b8; --amber:#a5660a; --teal:#0f7c7a; --violet:#8a3fa8; --green:#22804f; --red:#b83a32; --grey:#6b7570;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1311; --surface:#151c19; --surface-2:#1b2420; --line:#26312c; --line-2:#334039;
  --fg:#e4ece8; --muted:#97a69f; --accent:#5cc497; --accent-2:#74d3a8; --accent-soft:#183428; --on-accent:#06170f;
  --blue:#7ea6ef; --indigo:#a49af0; --amber:#e6b14f; --teal:#55c9c4; --violet:#cf8fe6; --green:#66cf93; --red:#f08a80; --grey:#a3ada8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#151c19; --surface-2:#1b2420; --line:#26312c; --line-2:#334039;
  --fg:#e4ece8; --muted:#97a69f; --accent:#5cc497; --accent-2:#74d3a8; --accent-soft:#183428; --on-accent:#06170f;
  --blue:#7ea6ef; --indigo:#a49af0; --amber:#e6b14f; --teal:#55c9c4; --violet:#cf8fe6; --green:#66cf93; --red:#f08a80; --grey:#a3ada8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:600}
h3{font-size:14px;margin:0;font-weight:600}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-size:18px;font-weight:600;text-decoration:none}
.logo{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-weight:700;font-size:13px;flex:none}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:17px;height:17px;flex:none}
.nav .badge{margin-left:auto}
.sep{height:1px;background:var(--line);margin:8px 6px}
.side .label{padding:6px 10px 2px}
.quick a{font-size:13px}
.usercard{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.topbar{display:none}
.main{min-width:0;padding-block:24px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{max-width:1280px;margin:0 auto;display:grid;gap:18px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-105%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
}

/* Controls */
button,.btn{font:inherit;cursor:pointer;border-radius:8px;padding:8px 13px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:500;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{background:var(--surface-2)}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--on-accent)!important}
.primary:hover{filter:brightness(1.07)}
.ghost{border-color:transparent;background:transparent}
.icon-btn{padding:6px;border-color:var(--line)}
button svg,.btn svg{width:16px;height:16px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
input.r{text-align:right}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.grow{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.card.flush{padding:0;gap:0;overflow:hidden}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;color:var(--muted);flex:1 0 auto}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filter{width:auto;padding:7px 10px;background:var(--surface)}
.search{position:relative;min-width:220px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search input{padding-left:32px}

/* Tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--surface-2)}
.nowrap{white-space:nowrap}

/* Pills & badges */
.pill{--c:var(--grey);display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.banklogo{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.banklogo i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:8.5px;letter-spacing:-.02em;font-weight:700;color:#fff;flex:none}
.status-cell{display:grid;gap:2px;justify-items:start}

/* Detail */
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--fg)}
.crumbs b{color:var(--fg);font-weight:500}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.detail-grid{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}}
.kv div{display:grid;gap:2px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:500;overflow-wrap:anywhere}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:500}
.linkbtn:hover{background:none;text-decoration:underline}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.step{display:grid;gap:6px}
.step .bar{height:5px;border-radius:3px;background:var(--line)}
.step.done .bar{background:var(--accent)}
.step.now .bar{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.step span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.now span,.step.done span{color:var(--fg)}
.doclist{display:grid}
.doc{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .nm{min-width:0}
.doc .nm a,.doc .nm div{overflow-wrap:anywhere}
.doc .ic{width:18px;height:18px;color:var(--muted)}
.doc.ok .ic{color:var(--green)}
.doc.miss .ic{color:var(--amber)}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;background:var(--surface)}
.tl.done i{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tl.now i{border-color:var(--amber);color:var(--amber)}
.tl i svg{width:12px;height:12px}
.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:560px;padding:0}
.msgs{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;background:var(--surface-2);display:grid;gap:3px}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg.note{background:color-mix(in srgb,var(--amber) 12%,transparent);border:1px dashed color-mix(in srgb,var(--amber) 45%,transparent)}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px}
.msg .meta{font-size:11px;color:var(--muted)}
.compose{border-top:1px solid var(--line);padding:12px;display:grid;gap:8px}
.empty{display:grid;place-items:center;color:var(--muted);text-align:center;padding:30px 10px;gap:6px}

/* Dashboard & boards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:3px}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
@media (max-width:420px){.two{grid-template-columns:minmax(0,1fr)}}
.bars{display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.barrow .fill{height:100%;background:var(--c,var(--accent));border-radius:5px}
.list{display:grid}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;align-content:start;min-height:200px}
.col h3{display:flex;justify-content:space-between;padding:2px 4px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
.lead select{padding:5px 7px;font-size:12px}

/* CTO */
.ctokpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ctokpis div{background:var(--surface);padding:11px 13px;display:grid;gap:2px}
.ctokpis b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.tbl-sm th,.tbl-sm td{padding:8px 10px;font-size:13px;white-space:nowrap}
.tbl-sm td input{min-width:90px;padding:5px 7px}
.tbl-sm td select{min-width:110px;padding:5px 7px}
.bordered{border:1px solid var(--line);border-radius:var(--r)}
tr.detailrow td{background:var(--surface-2);white-space:normal}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 24px;font-size:13px}
.breakdown div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.notice{background:color-mix(in srgb,var(--amber) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:8px;padding:10px 12px;font-size:13px}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.dropzone{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;padding:26px 16px;border:1.5px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2);cursor:pointer;color:var(--muted)}
.dropzone b{color:var(--fg);font-weight:600}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone.busy{opacity:.7;cursor:progress}
.dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.reasons{color:var(--muted);font-size:12px;white-space:normal;max-width:260px;margin-top:2px}

/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;width:min(480px,100%);display:grid;gap:14px;max-height:90vh;overflow-y:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.feedback-note{font-size:12px;color:var(--muted);text-align:center;padding:8px}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
.login{max-width:620px;margin:24px auto;display:grid;gap:16px}
body[data-auth="out"] .side,body[data-auth="out"] .topbar{display:none}
body[data-auth="out"] .shell{grid-template-columns:minmax(0,1fr)}
.fb-tab{position:fixed;right:env(safe-area-inset-right,0px);top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;z-index:25;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;padding:14px 8px;font-weight:600;font-size:13px}
.fb-tab:hover{background:var(--accent-soft);filter:brightness(.97)}
button:disabled,input:disabled,select:disabled{opacity:.6;cursor:not-allowed}
</style>

</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div style="min-width:0">
    <div class="topbar"><button class="icon-btn" data-act="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="logo" style="width:28px;height:28px;font-size:11px">MC</span><b>Mortgage CRM</b></div>
    <main class="main"><div class="page" id="view"></div></main>
  </div>
</div>
<button class="fb-tab" data-act="feedback">Feedback</button>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ===== FEEDBACK SETTINGS: fill in one or both, then save the file ===== */
const FEEDBACK_SHEET_URL=''; // Google Apps Script web app URL, e.g. 'https://script.google.com/macros/s/XXXX/exec'
const FEEDBACK_WHATSAPP='';  // WhatsApp number with country code, digits only, e.g. '971501234567'
/* ====================================================================== */
const BRAND='Mortgage CRM';
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>isFinite(n)?Math.round(n).toLocaleString('en-US'):'—';
const AED=n=>'AED '+fmt(n);
const DAY=86400000;
const uid=p=>p+Math.random().toString(36).slice(2,8);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function emi(P,rate,months){const r=rate/1200;return r?P*r/(1-Math.pow(1+r,-months)):P/months;}
function loanFromEmi(E,rate,months){if(E<=0)return 0;const r=rate/1200;return r?E*(1-Math.pow(1+r,-months))/r:E*months;}
function rel(ts){
  const d=new Date(ts),now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const time=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).toLowerCase();
  if(ts>=t0) return 'Today '+time; if(ts>=t0-DAY) return 'Yesterday '+time;
  return Math.max(2,Math.floor((t0-ts)/DAY)+1)+' days ago';
}
const dstr=ts=>new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const dtstr=ts=>new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'});
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600);}
function copy(txt,msg){const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg);}catch(e){toast('Copy failed. Select the text manually.');}ta.remove();};try{navigator.clipboard.writeText(txt).then(()=>toast(msg),fb);}catch(e){fb();}}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const I={
  products:'<path d="M3 21h18M5 21V10M19 21V10M9 21v-7M15 21v-7M2 10l10-6 10 6"/>',
  docs:'<path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2zM11 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>',
  proposals:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>',

  if(h==='login'){ location.replace('#dashboard'); h='dashboard'; active=h; }
  if((m=h.match(/^app-([a-z0-9]+)$/))){ active='applications'; const a=appById(m[1]); html=a&&canSeeOwner(a.brokerId)?vAppDetail(m[1]):`<div class="card"><h2>Application not found</h2><p class="muted" style="margin:0">It doesn't exist or it belongs to another broker.</p><a href="#applications">Back to applications</a></div>`; }
  else if((m=h.match(/^cto-([a-z0-9]+)$/))){ active='cto'; const a=appById(m[1]); html=a&&canSeeOwner(a.brokerId)?vCto(m[1]):vCto(null); }
  else if(h==='new-application') { active='applications'; html=vNewApp(); }
  else if(STAFF_ONLY.includes(h)&&!isStaff()) html=`<div class="card"><h2>Not available</h2><p class="muted" style="margin:0">This page is for the ${esc(BRAND)} team only.</p></div>`;
  else html=(VIEWS[h]||VIEWS.dashboard)();
  renderSide(active);
  $('#view').innerHTML=html;
  after.forEach(f=>f()); after=[];
  refreshInbox();
  window.scrollTo(0,0);
}

function timeline(a){
  if(['declined','hold'].includes(a.stage)){
    return `<div class="timeline">${a.timeline.slice().reverse().map((t,i)=>`<div class="tl ${i===0?'now':'done'}"><i>${ic(i===0?'clock':'check')}</i><div><b style="font-weight:500">${esc(t.sub)}</b><div class="small muted">${dtstr(t.at)} · ${esc(t.by)}${t.note?' · '+esc(t.note):''}</div></div></div>`).join('')}</div>`;
  }
  const cur=FLOW.findIndex(f=>f.stage===a.stage&&f.sub===a.sub);
  const hist=t=>a.timeline.slice().reverse().find(x=>x.sub===t);
  const rows=FLOW.map((f,i)=>({f,i})).filter(({i})=>i<=cur+1).reverse();
  const created=a.timeline[0];
  return `<div class="timeline">${rows.map(({f,i})=>{const h=hist(f.sub);const cls=i<cur||a.stage==='disbursed'?'done':i===cur?'now':'';
    return `<div class="tl ${cls}"><i>${cls==='done'?ic('check'):cls==='now'?ic('clock'):''}</i><div><b style="font-weight:500">${esc(f.sub)}</b><div class="small muted">${cls==='now'?'In progress':cls==='done'&&h?dtstr(h.at)+' · '+esc(h.by):'Next step'}</div></div></div>`;}).join('')}
    <div class="tl done"><i>${ic('check')}</i><div><b style="font-weight:500">Application created</b><div class="small muted">${dtstr(created.at)} · ${esc(created.by)}</div></div></div></div>`;
}

/* ============ Daily updates ============ */
function dayEvents(dateStr){
  const d0=new Date(dateStr+'T00:00:00').getTime(), d1=d0+DAY, ev=[], staff=isStaff();
  visibleApps().forEach(a=>{
    a.timeline.forEach((t,ti)=>{ if(ti===1&&Math.abs(t.at-a.timeline[0].at)<120000) return; if(t.at>=d0&&t.at<d1) ev.push({at:t.at,a,type:t.stage==='created'?'New application':'Stage change',text:t.stage==='created'?'Application created':t.sub+(t.note?' · '+t.note:'')}); });
    Object.entries(a.docs).forEach(([k,fs])=>fs.forEach(f=>{ if(f.at>=d0&&f.at<d1) ev.push({at:f.at,a,type:'Document',text:(k.split(':')[1]==='__other'?'Other file':k.split(':')[1])+' received'}); }));
    a.messages.forEach(m=>{ if(m.at>=d0&&m.at<d1&&m.from!=='sys'&&(staff||m.channel!=='internal')) ev.push({at:m.at,a,type:'Message',text:m.name+': '+(m.text.length>90?m.text.slice(0,90)+'…':m.text)}); });
  });
  return ev.sort((x,y)=>x.at-y.at);
}
function vDaily(){
  const day=ui.day||new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  ui.day=day;
  const ev=dayEvents(day), staff=isStaff();
  const cnt=t=>ev.filter(e=>e.type===t).length;
  const disb=ev.filter(e=>e.type==='Stage change'&&e.a.stage==='disbursed'&&e.text.startsWith('Disbursed'));
  const typeC={'New application':'var(--blue)','Stage change':'var(--teal)','Document':'var(--indigo)','Message':'var(--grey)'};

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mLabel=k=>{const [y,m]=k.split('-');return MONTHS[+m-1]+' '+y;};
function sampleMonths(){
  const r=rng(11),out=[],now=new Date();
  for(let i=12;i>=1;i--){
    const d=new Date(Date.UTC(now.getFullYear(),now.getMonth()-i,1));
    const key=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
    out.push({key,total:Math.round(200000+r()*50000),own:Math.round(15000+r()*15000),loan:i===8?100000:0,returns:r()<0.25?Math.round(2000+r()*6000):0,cash:Math.round(10000+r()*10000),adbDaily:Math.round(60000+r()*30000),adbFixed:Math.round(58000+r()*30000),adbEnd:Math.round(50000+r()*50000),rc:i===5?1:0});
    if(i===8) out[out.length-1].total+=100000;
  }
  return out;
}
function sampleTxns(){
  const r=rng(7),out=[];let bal=70000;const now=new Date();
  const custs=['GULF STAR GEN TRADING','MARINA FOODS LLC','BLUE OASIS CONTRACTING','AL REEM SUPPLIES','DESERT LINE LOGISTICS','PEARL HOSPITALITY'];
  const push=(date,desc,credit,debit)=>{if(debit&&bal-debit<10000)return;bal=+(bal+credit-debit).toFixed(2);out.push({date,desc,credit:+credit.toFixed(2),debit:+debit.toFixed(2),balance:bal});};
  const start=Date.UTC(now.getFullYear(),now.getMonth()-12,1), end=Date.UTC(now.getFullYear(),now.getMonth(),0);
  const loanDay=new Date(Date.UTC(now.getFullYear(),now.getMonth()-8,10)).toISOString().slice(0,10);
  const rcDay=new Date(Date.UTC(now.getFullYear(),now.getMonth()-5,15)).toISOString().slice(0,10);
  const refDay=new Date(Date.UTC(now.getFullYear(),now.getMonth()-7,22)).toISOString().slice(0,10);
  for(let t=start;t<=end;t+=DAY){
    const d=new Date(t),ds=d.toISOString().slice(0,10),dom=d.getUTCDate(),dow=d.getUTCDay();
    const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();
    if(dom===3||dom===17) push(ds,'CASH DEPOSIT CDM 0441',5000+r()*4000,0);
    if(dom===12) push(ds,'TRANSFER FROM OWN ACC ****0192',12000+r()*10000,0);
    if(ds===loanDay) push(ds,'FINANCE DISBURSAL - WORKING CAPITAL',100000,0);
    if(ds===refDay) push(ds,'REFUND - POS REVERSAL',3200,0);

async function ctoProcessFiles(files,opts={}){
  const list=[...files].filter(f=>!CT.files.some(x=>x.name===f.name&&x.size===f.size));

  CT.busy=true;renderUpload();
  const recs=[];for(const f of list) recs.push(await readStatement(f));
  CT.busy=false;CT.files.push(...recs);CT.source='statement';ctoRebuild();
  const ok=recs.filter(r=>r.status==='ok').length;
  if(CT.appId&&ok&&!opts.noSave) ctoStore(CT.appId);
  if($('#ctoUpload')){renderUpload();ctoData();ctoResults();}
  if(ok) toast(`${ok} statement${ok>1?'s':''} read: ${CT.months.length} months, ${CT.txns.length} transactions${CT.appId?'. Saved to the application.':''}`);

}

function ctoStore(appId){
  const a=appById(appId); if(!a) return null;
  const res=ctoCompute();
  a.cto={at:Date.now(),source:CT.source,months:CT.months.length,monthsData:CT.months.map(m=>({...m})),
    files:CT.source==='statement'?CT.files.filter(f=>f.status==='ok').map(f=>({name:f.name,size:f.size,bank:f.bank||'',period:f.period||'',mismatch:f.mismatch||0,tx:f.txns.map(t=>[t.date,String(t.desc).slice(0,80),t.credit,t.debit,t.balance,t.cat||null])})):[],
    rows:res.map(r=>({bankId:r.bankId,status:r.status,cto:r.cto||0,ctoTotal:r.ctoTotal||0,nMonths:r.nMonths||0,adb:r.adb||0,maxLoan:r.maxLoan||0}))};
  const best=res.find(r=>r.status!=='no');
  a.updated=Date.now();
  a.messages.push({from:'sys',name:'System',channel:'internal',text:`CTO / ADB calculated from ${CT.source==='statement'?CT.files.filter(f=>f.status==='ok').length+' statement(s)':'monthly figures'}: ${res.filter(r=>r.status==='ok').length} banks qualify${best?`, highest max loan ${AED(best.maxLoan)} (${bank(best.bankId).short})`:''}.`,at:Date.now()});
  save(); return a;
}

async function ctoFromDocuments(appId,files){
  const stmt=[...files].filter(f=>/\.(pdf|xlsx|xls|csv)$/i.test(f.name));
  if(!stmt.length) return;
  ctoInit(appId,true);
  toast('Reading the statement to calculate CTO / ADB…');
  const recs=await ctoProcessFiles(stmt);
  if(recs.some(r=>r.status==='ok')){ ui.detailTab='cto'; if(location.hash==='#app-'+appId) route(); }
  else if(recs.some(r=>r.status==='password')) toast('This statement is password-protected. Open the CTO / ADB calculator to enter the password.');
}

/* ============ shared feedback (platform) ============ */
const P={db:null,user:null,comments:null,uid:null,canWrite:null,canEdit:false,shared:[],names:{},state:'idle'};
async function platformInit(){
  const use=n=>(window.claude&&typeof window.claude.use==='function')?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  const [cm,u,db]=await Promise.all([use('comments'),use('user'),use('db')]);
  P.comments=cm;P.user=u;P.db=db;
  if(u){try{P.uid=await u.id();}catch(e){} try{P.canWrite=await u.can('data.write');}catch(e){} try{P.canEdit=!!(await u.canEdit());}catch(e){}}
  if(db&&P.canEdit){
    P.state='loading';
    const timer=setTimeout(()=>{if(P.state==='loading'){P.state='slow';refreshInbox();}},10000);
    try{db.collection('feedback').onSnapshot(async snap=>{
      if(!snap.metadata||!snap.metadata.fromCache) clearTimeout(timer);
      P.state='ready';
      const list=[];snap.docs.forEach(d=>{const v=d.data()||{};(Array.isArray(v.entries)?v.entries:[]).forEach(e=>{if(e&&typeof e.text==='string')list.push({...e,uid:d.id});});});
      P.shared=list.sort((a,b)=>(+b.at||0)-(+a.at||0));
      const ids=[...new Set(list.map(e=>e.uid))];
      if(u&&ids.length){try{const ps=await u.profiles(ids);ids.forEach(id=>{P.names[id]=(ps&&ps[id]&&ps[id].name)||'';});}catch(e){}}
      refreshInbox();
    },()=>{clearTimeout(timer);P.state='error';refreshInbox();});}catch(e){P.state='error';}
  }
  refreshInbox();
}
function refreshInbox(){const box=document.getElementById('sharedInbox');if(box)box.innerHTML=inboxHtml();}
function inboxHtml(){
  if(!P.canEdit) return '';
  const head=`<div class="row spread"><div><h2>Tester feedback</h2><div class="small muted">From everyone you shared this link with. Only you and editors see this.</div></div>${P.shared.length?'<button data-act="inbox-copy">Copy all</button>':''}</div>`;
  let body;
  if(P.state==='loading') body='<p class="muted" style="margin:0">Loading feedback…</p>';
  else if(P.state==='slow') body='<p class="muted" style="margin:0">Feedback can\'t be reached yet. It will appear when the connection returns.</p>';
  else if(P.state==='error') body='<p class="muted" style="margin:0">Feedback couldn\'t be loaded on this visit. Reopen the page to try again.</p>';
  else if(!P.shared.length) body='<p class="muted" style="margin:0">No feedback yet. Share the link and ask testers to use the Feedback tab on the right edge.</p>';
  else body=`<div class="list">${P.shared.slice(0,50).map(e=>`<div class="li"><div><span class="pill" style="--c:${e.type==='Problem'?'var(--red)':e.type==='Idea'?'var(--teal)':'var(--grey)'}">${esc(e.type)}</span> ${esc(e.text)}<div class="small muted">${esc(P.names[e.uid]||'A tester')} · ${esc(e.persona||'')} · screen: ${esc(e.screen||'')} · ${e.at?rel(+e.at):''}</div></div></div>`).join('')}</div>`;
  return `<section class="card">${head}${body}</section>`;
}
async function sendShared(entry){
  const btn=document.querySelector('[data-act="fb-send"]');if(btn){btn.disabled=true;btn.textContent='Sending…';}
  if(FEEDBACK_SHEET_URL){try{await fetch(FEEDBACK_SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(entry)});closeModal();toast('Thanks! Your feedback was sent to the team.');return;}catch(e){}}
  if(P.db&&P.uid&&P.canWrite!==false){
    try{const ref=P.db.doc('feedback/'+P.uid);const cur=await ref.get();const d=cur.exists?(cur.data()||{}):{};const old=Array.isArray(d.entries)?d.entries:[];
      await ref.set({entries:[...old,entry].slice(-200)});
      closeModal();toast('Thanks! Your feedback was sent to the team.');if(isAdmin()||!me())route();return;}catch(e){}
  }
  const txt=`Feedback (${entry.type})${entry.name?' from '+entry.name:''} on the ${entry.screen} screen, signed in as ${entry.persona}:\n${entry.text}`;
  const num=FEEDBACK_WHATSAPP.replace(/\D/g,'');
  const wa=num?`<a class="btn primary" href="https://wa.me/${num}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener" data-act="close">Send on WhatsApp</a>`:'';
  const cm=P.comments?`<button ${wa?'':'class="primary"'} data-act="fb-copy-comment">Copy and open comment box</button>`:'';
  const msg=wa?'Tap the button to send your feedback to the team on WhatsApp.':cm?'Your access can\'t save feedback here directly. Copy it, then post it as a comment on this page.':'Copy your feedback and send it to the person who shared this link.';
  modal(`<h2>${wa?'Send your feedback':'One more step'}</h2><p class="muted" style="margin:0">${msg}</p><textarea id="fbCopy" rows="5" readonly>${esc(txt)}</textarea><div class="row">${wa}${cm}<button ${wa||cm?'':'class="primary"'} data-act="fb-copy">Copy</button><button data-act="close">Close</button></div>`);
}

['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('.dropzone');if(z){e.preventDefault();z.classList.add('over');}}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.dropzone');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('.dropzone');if(!z)return;e.preventDefault();z.classList.remove('over');if(CT&&!CT.busy&&e.dataTransfer&&e.dataTransfer.files.length)ctoProcessFiles(e.dataTransfer.files);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-href],tr[data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='appSearch'){ui.q=t.value;appRows();return;}
  if(t.dataset.ctop){CT.p[t.dataset.ctop]=+t.value||0;ctoResults();return;}
  if(t.closest('#newApp')){naUpdate();return;}
  if(t.closest('#calcForm')){calcUpdate();return;}
  if(t.id==='pr-amt'||t.id==='pr-ten'){prRows();return;}
});
document.addEventListener('change',e=>{
  const t=e.target,act=t.dataset.act;
  if(t.dataset.f&&t.classList.contains('filter')){ui[t.dataset.f]=t.value;route();return;}
  if(t.closest('#newApp')){naUpdate();return;}
  if(t.closest('#calcForm')){calcUpdate();return;}
  if(t.id==='dayPick'){ui.day=t.value||null;route();return;}
  if(t.id==='ctoAttach'&&t.value){ctoSaveTo(t.value);return;}
  if(t.dataset.cm!==undefined){const m=CT.months[+t.dataset.cm];if(t.dataset.f==='key'){if(t.value)m.key=t.value;CT.months.sort((a,b)=>a.key<b.key?-1:1);}else m[t.dataset.f]=Math.max(0,+t.value||0);ctoData();ctoResults();return;}
  if(t.dataset.rule!==undefined){if(!isAdmin())return;const b=S.rules[+t.dataset.rule],f=t.dataset.f;b[f]=['dates','adb','basis'].includes(f)?t.value:(+t.value||0);save();ctoResults();if(f==='adb')ctoData();return;}
  switch(act){
    case 'move':{const a=appById(t.dataset.id),[st,sub]=t.value.split('|');a.stage=st;a.sub=sub;addTimeline(a,st,sub);a.messages.push({from:'sys',name:'System',channel:'broker',text:`Status changed to ${sub}`,at:Date.now()});save();route();toast('Moved to '+sub+'. The broker is notified.');return;}
    case 'upload':{const fs=[...t.files];if(!fs.length)return;const a=appById(t.dataset.id),k=t.dataset.k;a.docs[k]=a.docs[k]||[];fs.forEach(f=>a.docs[k].push({file:f.name,at:Date.now(),by:S.session}));a.updated=Date.now();save();route();const cl=client(a.clientId);if(/bank statements/i.test(k)&&(cl.employment==='Self-employed'||(k.startsWith('co:')&&cl.co&&cl.co.employment==='Self-employed'))){ctoFromDocuments(a.id,fs);}else toast(fs.length+' file'+(fs.length>1?'s':'')+' added. The prototype keeps file names only.');return;}
    case 'task':{const a=appById(t.dataset.id),k=a.tasks.find(x=>x.id===t.dataset.t);k.done=t.checked;save();route();return;}
    case 'lead-stage':{const l=S.leads.find(x=>x.id===t.dataset.id);l.stage=t.value;save();route();return;}
    case 'cmp':{ui.cmp=ui.cmp||[];if(t.checked)ui.cmp.push(t.dataset.id);else ui.cmp=ui.cmp.filter(x=>x!==t.dataset.id);route();return;}
    case 'cto-txf':CT.txFilter=t.value;ctoData();return;
    case 'cto-cat':CT.txns[+t.dataset.i].cat=t.value;ctoRebuild();ctoData();ctoResults();return;
    case 'cto-files':{const fs=[...t.files];t.value='';if(fs.length)ctoProcessFiles(fs);return;}
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='leadForm'){const v=id=>$(id).value.trim();if(!v('#lf-name')||!v('#lf-mobile')){toast('Enter a name and mobile number');return;}S.leads.push({id:uid('l'),name:v('#lf-name'),mobile:v('#lf-mobile'),source:v('#lf-source'),stage:'New',created:Date.now(),budget:+v('#lf-budget')||0,owner:$('#lf-owner').value||S.session,note:''});ui.leadForm=false;save();route();toast('Lead added');return;}

    const mode=(e.submitter&&e.submitter.dataset.mode)||'submitted';
    let cid=$('#na-client').value;
    if(!cid){const n=$('#na-name').value.trim();if(!n){toast('Enter the client\'s name or pick an existing client');return;}
      const c={id:uid('c'),name:n,mobile:$('#na-mobile').value.trim(),email:$('#na-email').value.trim(),nationality:$('#na-nat').value.trim(),residency:$('#na-res').value,employment:$('#na-emp').value,salary:+$('#na-salary').value||0,emis:+$('#na-emis').value||0,cards:+$('#na-cards').value||0,employer:'',company:'',dob:'',eidExpiry:new Date(Date.now()+365*DAY).toISOString().slice(0,10),passportExpiry:new Date(Date.now()+900*DAY).toISOString().slice(0,10),co:null};
      if(!c.mobile||!c.email){toast('Enter the client\'s mobile and email. Banks need both.');return;}
      S.clients.push(c);cid=c.id;}
    const p=S.products.find(x=>x.id===$('#na-product').value),b=$('#na-bank').value;
    const brokerId=$('#na-broker')?$('#na-broker').value:S.session, ma=$('#na-ma')?$('#na-ma').value:autoAdvisor();
    const a={id:uid('a'),appId:newAppId(),clientId:cid,bankId:b,productId:p?p.id:'',amount:+$('#na-amount').value||0,property:+$('#na-prop').value||0,rate:p?p.rate:4.5,fixed:p?p.fixed:0,tenure:+$('#na-tenure').value||300,stl:$('#na-stl').value,type:p?p.type:'Conventional',transaction:$('#na-tx').value,caseType:$('#na-case').value,banker:'To be assigned',bankerManager:'To be assigned',advisor:ma,brokerId,submittedBy:S.session,source:$('#na-source').value,status:mode,stage:'preapproval',sub:'Documents collection',created:Date.now(),updated:Date.now(),unread:0,timeline:[{stage:'created',sub:'Application created',at:Date.now(),by:me().name},{stage:'preapproval',sub:'Documents collection',at:Date.now(),by:me().name}],docs:{},messages:mode==='submitted'?[{from:'sys',name:'System',channel:'broker',text:`Application submitted. ${ma} is your mortgage advisor.`,at:Date.now()}]:[],tasks:[],commission:{received:null},cto:null};
    S.apps.push(a);
    if(ui.convertLead){const l=S.leads.find(x=>x.id===ui.convertLead);if(l)l.stage='Converted';}
    ui.convertLead=ui.prefillName=ui.prefillMobile=ui.prefillBudget=ui.prefillClient=ui.prefillBroker=null;
    save();ui.detailTab='mortgage';ui.docTab='main';location.hash='#app-'+a.id;toast(mode==='draft'?'Draft saved':'Application submitted. '+ma+' is assigned.');
  }
});
window.addEventListener('hashchange',()=>{ if(!location.hash.startsWith('#app-')){ui.detailTab='mortgage';ui.docTab='main';ui.more=false;} route(); if(location.hash==='#new-application') naUpdate(); if(location.hash==='#proposals') prRows(); });
route(); if(location.hash==='#new-application') naUpdate(); if(location.hash==='#proposals') prRows();
platformInit();
})();
</script>
